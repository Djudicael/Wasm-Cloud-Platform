[package]
name = "postgres-app"
version = "0.1.0"
edition = "2021"

[target.'cfg(target_family = "wasm")'.dependencies]
url = "2"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = { workspace = true }
tokio = { workspace = true }

[profile.release]
opt-level = "s"
lto = true
strip = "symbols"