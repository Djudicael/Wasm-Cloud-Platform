
[package]
name = "hello-axum"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hello-axum"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }

# For non-WASM targets, use full tokio
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }

# For WASM targets, only use WASM-compatible features
[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1.51", default-features = false, features = ["sync", "macros", "io-util", "rt", "time"] }

[profile.release]
opt-level = 3
lto = true
strip = "symbols"
