[advisories]
ignore = [
    # Approved, time-bounded exceptions are documented in
    # INFRA_IMPL/process/DEPENDENCY_SECURITY_EXCEPTIONS.md. Do not pre-ignore
    # advisories which are absent from the current lockfile.
    "RUSTSEC-2025-0069", # daemonize via pingora
    "RUSTSEC-2024-0388", # derivative via pingora
    "RUSTSEC-2024-0384", # instant via wstd / wasi-pg-client
    # Pingora 0.8.1 pins lru ^0.16.3 while the fix requires >=0.18.2. Its pop() call
    # sites use integer/connection-ID keys, so the advisory's panicking key-Drop
    # prerequisite is not reachable in this dependency path.
    "RUSTSEC-2026-0253",
    "RUSTSEC-2025-0134", # rustls-pemfile via pingora-rustls

    # Pingora uses protobuf only to construct and encode locally generated metrics;
    # the advisory's attacker-controlled recursive parsing path is not exposed.
    "RUSTSEC-2024-0437", # protobuf via pingora-core/prometheus 0.13
]
