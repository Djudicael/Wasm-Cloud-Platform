# production.toml — Production environment configuration
#
# Usage: wasm-node --config config/production.toml
#
# This configuration is intended for production deployments.
# All values are tuned for stability, security, and performance under
# sustained load. Adjust thresholds based on your actual hardware and
# traffic patterns.
#
# Environment variables (WASM_NODE_<SECTION>_<KEY>) override values in
# this file. CLI flags override everything. Merge priority:
#   defaults < TOML file < environment variables < CLI flags

[node]
# Unique node identifier within the cluster.
# Override per-node via WASM_NODE_NODE_ID or --node-id.
node_id = "prod-node-0"

[storage]
# Path to the redb database file. Ensure the directory exists and
# the wasm-node process has read/write permissions.
db_path = "/var/lib/wasm-node/state.redb"
# On unreadable DB open, quarantine and fail by default. Set to
# "quarantine_and_recreate" only if you intentionally want a fresh local DB.
# open_failure_mode = "quarantine_and_fail"
# On critical integrity failure, quarantine and exit by default.
# integrity_failure_mode = "quarantine_and_exit"

[nats]
# NATS server URL (production cluster).
url = "nats://nats.prod:4222"
# Credentials file for authenticated NATS connections.
# Required in production if the NATS cluster requires authentication.
creds_file = "/etc/wasm-node/nats.creds"

[proxy]
# HTTP proxy port (North-South traffic).
http_port = 80
# HTTPS proxy port (0 = disabled). Set to 443 when terminating TLS here.
https_port = 443
# TLS certificate and private key paths (required when https_port > 0).
tls_cert = "/etc/wasm-node/tls/server.crt"
tls_key = "/etc/wasm-node/tls/server.key"

[admin]
# Admin API port (metrics, health, config changes).
port = 9090
# Bind the admin API locally by default. Change only when you intentionally
# front it with a trusted proxy or other network control.
bind_address = "127.0.0.1"
# Artifact server port (Wasm binary distribution).
artifact_port = 9091
# Bind the artifact server locally by default.
artifact_bind_address = "127.0.0.1"
# Dedicated TLS certificate/key for the admin HTTPS listener. If unset, the
# node falls back to the shared [proxy] TLS material.
tls_cert = "/etc/wasm-node/admin/server.crt"
tls_key = "/etc/wasm-node/admin/server.key"
# Optional routable artifact advertisement for peer nodes. Leave unset for
# local-only mode. In multi-node deployments, set one of these to a routable
# hostname or URL instead of relying on loopback defaults.
# advertised_host = "node-1.internal"
# advertised_artifact_url = "https://artifacts.node-1.internal"

[auth]
# Use the structured auth config instead of legacy admin.auth_token.
enabled = true
# Read-only token for metrics/health/inspection.
read_token = "CHANGE-ME-USE-A-STRONG-RANDOM-READ-TOKEN"
# Read-write token for operators and automation.
write_token = "CHANGE-ME-USE-A-STRONG-RANDOM-WRITE-TOKEN"
# The admin HTTPS listener uses admin.tls_cert/admin.tls_key when set, and
# otherwise falls back to the shared [proxy] TLS material.
require_tls = true
rate_limit_per_second = 10
rate_limit_burst = 20

[runtime]
# Port range for Wasm instance binding.
# 10 000 ports supports up to ~100 apps with 100 instances each.
port_start = 10000
port_end = 19999
# Key source: "generate" (ephemeral), "file" (from key_file), "env:VAR_NAME"
# Use "file" in production so secrets survive restarts.
key_source = "file"
key_file = "/etc/wasm-node/master.key"
# Optional Wasmtime code cache directory for faster repeated compilation/startup.
cache_directory = "/var/cache/wasm-node/wasmtime"
# Optional Ed25519 public key (32-byte hex) for signed upgrade metadata.
# upgrade_signing_public_key = "PUT-32-BYTE-HEX-PUBLIC-KEY-HERE"
# Optional pooling allocator for higher instantiation throughput. Keep disabled
# unless you have benchmarked it for your workload and sized the pool limits.
# pooling_allocator = true
# pooling_total_component_instances = 1000
# pooling_max_core_instances_per_component = 32
# pooling_max_memories_per_component = 8
# pooling_max_tables_per_component = 8

[database]
# Default database URL injected into Wasm apps via DATABASE_URL env var.
default_url = "postgres://db.prod:5432/wasm_platform"
# pgBouncer health check address.
pgbouncer_addr = "pgbouncer.prod:5432"
# Enable built-in TCP proxy (not PostgreSQL-aware).
enable_db_proxy = false
db_proxy_addr = "127.0.0.1:5433"
db_proxy_backend = "db.internal:5432"
db_proxy_max_connections = 50

[logging]
# Log level: trace, debug, info, warn, error
# Use "info" in production; switch to "debug" temporarily via hot-reload.
level = "info"
# Optional OpenTelemetry OTLP endpoint for centralized log collection.
# otlp_endpoint = "http://collector.prod:4317"

[billing]
# Directory for billing record exports (enables periodic export).
export_dir = "/var/lib/wasm-node/billing"
# Export interval in seconds (1 hour).
export_interval_secs = 3600

[gc]
# How many compiled artifact versions to retain per app.
# Keep 3 versions to allow quick rollbacks without recompilation.
artifact_keep_versions = 3
# How many days of metric buckets to retain.
metrics_retain_days = 7
# Grace period after undeploy before purging state (seconds).
# 1 hour gives operators time to notice and recover if undeployed by mistake.
undeploy_grace_secs = 3600
# GC loop interval (seconds). 10 minutes balances cleanup frequency vs I/O.
gc_interval_secs = 600
# Disk usage warning threshold (0.0–1.0). Alert at 80%.
disk_warning_threshold = 0.80

[rate_limit]
# Default per-app requests per second.
default_requests_per_second = 1000
# Default per-app burst capacity.
default_burst_capacity = 200
# Default per-IP requests per second.
default_per_ip_limit = 200

[ebpf]
# Enable eBPF monitoring (requires Linux kernel >= 5.8 with BTF).
enabled = true
# FD soft limit per Wasm instance (warning at 80%).
fd_soft_limit = 8192
# FD hard limit per Wasm instance (kill at 95%).
fd_hard_limit = 9728
# Memory pressure low threshold (pages). 65536 pages = 4 GiB.
mem_low_threshold_pages = 65536
# Memory pressure critical threshold (pages). 16384 pages = 1 GiB.
mem_critical_threshold_pages = 16384
# Disk I/O latency threshold for "slow" alert (nanoseconds). 50 ms.
disk_slow_threshold_ns = 50000000
# Maximum TCP connections per PID before alert.
tcp_conn_limit_per_pid = 10000
# Syscall rate limit per second for suspicious categories.
syscall_rate_limit = 100000
# Sampling period for periodic counters (seconds).
sampling_period_secs = 10

[dns]
# Platform domain for subdomain routing.
platform_domain = "myplatform.com"
# Webhook URL for DNS automation (creates DNS records on deploy).
# webhook_url = "https://dns-api.example.com/records"
# Webhook authentication token.
# webhook_token = "secret"

[health]
# Health check loop interval (seconds).
check_interval_secs = 5
# Treat cluster-node registry entries as stale after this many seconds without
# a fresh event. Used by deploy peer selection and rolling upgrades.
cluster_node_stale_after_secs = 120
# Instance idle timeout (seconds). Kill instances idle for 5 minutes.
default_idle_timeout_secs = 300
# Maximum instances per app on this node.
default_max_instances = 10
# Default fuel quota per execution (Wasm instruction count).
default_fuel_quota = 500000000
# Default memory limit in pages (1 page = 64 KiB). 2048 pages = 128 MiB.
default_memory_pages = 2048
