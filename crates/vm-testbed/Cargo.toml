[package]
name = "vm-testbed"
version = "0.1.0"
license.workspace = true
edition = "2021"
description = "MicroVM-based testbed for pre-production validation of the Wasm Cloud Platform using Firecracker"

[features]
default = []
# Enable tests that require a real Firecracker installation and KVM
firecracker = []
# Enable chaos tests that require network manipulation capabilities
chaos = ["firecracker"]

[dependencies]
tokio = { workspace = true, features = ["full", "process", "fs", "io-util"] }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
tempfile = "3.27.0"
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
which = "8.0.2"

# Re-use existing E2E test infrastructure
e2e = { version = "0.1.0", path = "../e2e" }
common = { version = "0.1.0", path = "../common" }
messaging = { version = "0.1.0", path = "../messaging" }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter"] }
assert_cmd = "2.2.2"
async-nats = { workspace = true }

[[bin]]
name = "vm-testbed-cli"
path = "src/cli.rs"
