[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Match cargo-audit by checking unsound advisories in transitive dependencies,
# not only workspace crates.
unsound = "all"
ignore = [
    # transitive unmaintained crates without practical replacements in the current graph
    "RUSTSEC-2025-0069", # daemonize via pingora
    "RUSTSEC-2024-0388", # derivative via pingora
    "RUSTSEC-2024-0384", # instant via wstd / wasi-pg-client 0.2
    "RUSTSEC-2025-0134", # rustls-pemfile via pingora-rustls

    # upstream stacks currently pin these vulnerable or otherwise flagged crates
    "RUSTSEC-2024-0437", # protobuf via pingora-core/prometheus 0.13
    # Pingora pins lru ^0.16.3 while the fix requires >=0.18.2. Its relevant
    # call sites use integer/connection-ID keys, so a panicking key Drop is not
    # reachable through the reviewed dependency path.
    "RUSTSEC-2026-0253",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
