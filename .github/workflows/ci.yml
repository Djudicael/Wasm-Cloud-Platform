name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Job 1: Fast unit tests (< 30s)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          targets: wasm32-wasip2

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --workspace --lib --bins
        timeout-minutes: 15

  # Job 2: Integration tests (< 3 min)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          targets: wasm32-wasip2

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Run storage integration tests
        run: cargo test -p storage --tests
        timeout-minutes: 6

      - name: Run runtime integration tests
        run: cargo test -p runtime --tests
        timeout-minutes: 6

  # Job 3: Critical gateway + supervisor integration suites
  gateway-supervisor-tests:
    name: Gateway and Supervisor Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          targets: wasm32-wasip2

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gateway-supervisor-${{ hashFiles('**/Cargo.lock') }}

      - name: Run proxy gateway integration tests
        run: cargo test -p proxy --test gateway_integration
        timeout-minutes: 10

      - name: Run supervisor integration tests
        run: cargo test -p supervisor --tests
        timeout-minutes: 10

  # Job 4: Node critical integration suites
  node-critical-tests:
    name: Node Critical Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          targets: wasm32-wasip2

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-node-critical-${{ hashFiles('**/Cargo.lock') }}

      - name: Start NATS with JetStream for cluster bootstrap tests
        run: docker run -d --rm --name nats-ci-bootstrap -p 4222:4222 docker.io/library/nats:2.10-alpine -js
        timeout-minutes: 1

      - name: Run node cluster bootstrap regression suite
        run: cargo test -p node --test cluster_bootstrap
        timeout-minutes: 10

      - name: Run node DB integration tests
        run: cargo test -p node --test db_integration
        timeout-minutes: 3

      - name: Stop NATS bootstrap container
        if: always()
        run: docker rm -f nats-ci-bootstrap
        timeout-minutes: 1

  # Job 5: E2E tests with NATS (< 15 min)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8222/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          targets: wasm32-wasip2

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: Build hello-axum test app
        run: |
          cargo build \
            --manifest-path apps/hello-axum/Cargo.toml \
            --target wasm32-wasip2 \
            --release
        timeout-minutes: 5

      - name: Build E2E helper binaries
        run: cargo build -p node -p ctl -p deploy-ingress
        timeout-minutes: 20

      - name: Build E2E test binaries
        run: cargo test -p e2e --no-run
        env:
          NATS_URL: nats://localhost:4222
        timeout-minutes: 12

      - name: Run E2E smoke suites
        run: |
          cargo test -p e2e --test deploy_and_request -- --test-threads=1
          cargo test -p e2e --test routes -- --test-threads=1
          cargo test -p e2e --test east_west -- --test-threads=1
          cargo test -p e2e --test hot_swap -- --test-threads=1
          cargo test -p e2e --test namespace_enforcement -- --test-threads=1
          cargo test -p e2e --test postgres -- --test-threads=1
          cargo test -p e2e --test wasi_http_component -- --test-threads=1
        env:
          NATS_URL: nats://localhost:4222
        timeout-minutes: 10

      - name: Run E2E config hot reload suite
        run: cargo test -p e2e --test config_hot_reload -- --test-threads=1
        env:
          NATS_URL: nats://localhost:4222
        timeout-minutes: 8

      - name: Run E2E disaster recovery suite
        run: cargo test -p e2e --test disaster_recovery -- --test-threads=1
        env:
          NATS_URL: nats://localhost:4222
        timeout-minutes: 8

      - name: Run E2E gateway suite
        run: cargo test -p e2e --test gateway -- --test-threads=1
        env:
          NATS_URL: nats://localhost:4222
        timeout-minutes: 8

      - name: Run E2E billing suite
        run: cargo test -p e2e --test billing -- --test-threads=1
        env:
          NATS_URL: nats://localhost:4222
        timeout-minutes: 8

      - name: Run E2E chaos suite
        run: cargo test -p e2e --test chaos -- --test-threads=1
        env:
          NATS_URL: nats://localhost:4222
        timeout-minutes: 20

      - name: Run cluster registry E2E regression
        run: cargo test -p e2e test_live_cluster_registry_drives_artifact_authorize_audience_set -- --ignored --test-threads=1 --nocapture
        env:
          NATS_URL: nats://localhost:4222
        timeout-minutes: 8

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-logs
          path: |
            *.log
            target/**/*.log

  # Job 6: Linting with Clippy
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-wasip2

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        timeout-minutes: 15

  # Job 7: Code formatting
  format:
    name: Code Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
        timeout-minutes: 1

  # Job 8: Build check (verify all crates compile)
  build:
    name: Build All Crates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          targets: wasm32-wasip2

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Check workspace targets
        run: cargo check --workspace --all-targets --exclude http-hello-component --exclude wasi-grpc-echo
        timeout-minutes: 20

      - name: Build WASI component apps
        run: |
          cargo build --manifest-path apps/http-hello-component/Cargo.toml --target wasm32-wasip2
          cargo build --manifest-path apps/wasi-grpc-echo/Cargo.toml --target wasm32-wasip2
        timeout-minutes: 15

      - name: Build release binaries and libraries
        run: cargo build --workspace --release --lib --bins --exclude http-hello-component --exclude wasi-grpc-echo
        timeout-minutes: 30

      - name: Build WASI component apps release
        run: |
          cargo build --manifest-path apps/http-hello-component/Cargo.toml --target wasm32-wasip2 --release
          cargo build --manifest-path apps/wasi-grpc-echo/Cargo.toml --target wasm32-wasip2 --release
        timeout-minutes: 20

  # Job 9: Security audit (blocking)
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-security-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Run security audit
        run: cargo audit --deny warnings
        timeout-minutes: 5

  # Job 10: Dependency policy checks
  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.lock', 'deny.toml') }}

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.6 --locked

      - name: Run cargo-deny policy checks
        run: cargo deny check advisories bans sources
        timeout-minutes: 5
