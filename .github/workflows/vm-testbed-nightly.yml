name: VM Testbed Nightly

# Test infrastructure only. Firecracker and its guest kernel model a VPS-like
# environment; they are not Wasm Cloud Platform release artifacts.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-testbed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-testbed:
    name: VM Testbed Integration (Nightly / Manual)
    runs-on: [self-hosted, linux, x64, kvm]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip2

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-vm-testbed-${{ hashFiles('**/Cargo.lock') }}

      - name: Run single-node VM deploy test
        run: cargo test -p vm-testbed --features firecracker --test single_node_deploy
        timeout-minutes: 20

      - name: Run VM chaos test suite
        run: cargo test -p vm-testbed --features chaos --test vm_chaos
        timeout-minutes: 30
