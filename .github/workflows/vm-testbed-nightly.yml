name: VM Testbed Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-testbed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-testbed:
    name: VM Testbed Integration (Nightly / Manual)
    runs-on: [self-hosted, linux, x64, kvm]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip2

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-vm-testbed-${{ hashFiles('**/Cargo.lock') }}

      - name: Run single-node VM deploy test
        run: cargo test -p vm-testbed --features firecracker --test single_node_deploy
        timeout-minutes: 20

      - name: Run VM chaos test suite
        run: cargo test -p vm-testbed --features chaos --test vm_chaos
        timeout-minutes: 30
