[workspace]
resolver = "2"
members = [
    "crates/node",
    "crates/supervisor",
    "crates/runtime",
    "crates/proxy",
    "crates/storage",
    "crates/messaging",
    "crates/secrets",
    "crates/metrics",
    "crates/common",
    "crates/ctl",
    "apps/hello-axum"
]

[workspace.dependencies]
# Async
tokio        = { version = "1", features = ["full"] }

# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
bincode      = "2"

# Error handling
thiserror    = "1"
anyhow       = "1"

# Logging / Tracing
tracing               = "0.1"
tracing-subscriber    = { version = "0.3", features = ["env-filter", "json"] }

# Wasm runtime
wasmtime              = { version = "20.0" }
wasmtime-wasi         = { version = "20.0" }

# Proxy
pingora               = "0.4"
pingora-proxy         = "0.4"
pingora-load-balancing = "0.4"
pingora-core          = "0.4"

# Storage
redb = "2"

# Messaging
async-nats = "0.36"

# Encryption
aes-gcm          = "0.10"

# Metrics
prometheus      = { version = "0.13", features = ["process"] }

# HTTP (admin API)
axum = "0.7"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Utils
uuid   = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Testing
reqwest = { version = "0.12", features = ["json"] }
testcontainers = "0.27.2"
